spring.application.name=ShopEasy
spring.config.import=optional:file:./.env[.properties],optional:file:./Backend/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopeasy}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.schemas=${DB_SCHEMA:shopeasy_app}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:shopeasy_app}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.error.include-message=never
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:http://localhost:8080}
app.jwt.ttl-minutes=60
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
