version: "3.8"
services:
  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      default:

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopeasy
    ports:
      - "5432:5432"
    networks:
      default:

networks:
  default:
    driver: bridge